/**:
  # Global Parameters
  ros__parameters:
    use_sim_time: true
    tf_timeout_threshold: 0.1

/**:
  # Basic Robotics Functions
  platform:
    ros__parameters:
      cmd_freq: 50.0  # Hz of platform commands send

  # State Estimator
  state_estimator:
    ros__parameters:
      use_gazebo_tf: true
      plugin_name: "ground_truth"
      # Outdoor (GPS)
      use_gps: true
      set_origin_on_start: true # Set origin on start

  # Motion Controller
  controller_manager:
    ros__parameters:
      cmd_freq: 50.0 # Hz of controller commands send

  # Behaviors Motion
  TakeoffBehavior:
    ros__parameters:
      # takeoff_plugin_name: "takeoff_plugin_speed"
      takeoff_plugin_name: "takeoff_plugin_position"
      # takeoff_plugin_name: "takeoff_plugin_trajectory"
  LandBehavior:
    ros__parameters:
      land_plugin_name: "land_plugin_speed"
      # land_plugin_name: "land_plugin_trajectory"
  GoToBehavior:
    ros__parameters:
      go_to_plugin_name: "go_to_plugin_position"
      # go_to_plugin_name: "go_to_plugin_trajectory"
  FollowPathBehavior:
    ros__parameters:
      follow_path_plugin_name: "follow_path_plugin_position"
      # follow_path_plugin_name: "follow_path_plugin_trajectory"
      # How close the drone must get before a waypoint counts as reached.
      #
      # AS2's default is 0.2 m, and that is tighter than this airframe's
      # pid_speed_controller can actually hold. Measured live, repeatedly:
      # the drone settles 0.235 - 0.24 m from the waypoint and stays there --
      # the controller keeps commanding ~0.24 m/s toward it and the position
      # does not change. Because 0.24 > 0.20, FollowPath never marks the
      # waypoint reached, reports RUNNING forever, and the mission hangs on
      # its FIRST waypoint. Confirmed by measurement: waypoint at earth
      # x=25.02, drone parked at x=24.78, for minutes.
      #
      # 0.5 m clears that steady-state error with margin and costs nothing
      # in coverage quality: the camera footprint at scan altitude is about
      # 9 m across, so a half-metre of waypoint slop is a rounding error
      # against the 20% line overlap the path planner already applies.
      follow_path_threshold: 0.5

  # Trajectory Generation Behavior
  TrajectoryGeneratorBehavior:
    ros__parameters:
      plugin_name: "dynamic_mav_trajectory_generator"

  # Behaviors Perception
  point_gimbal_behavior:
    ros__parameters:
      behavior_timeout: 10.0
      gimbal_name: gimbal
      gimbal_frame_id: gimbal/_0/_1/_2
      gimbal_base_frame_id: gimbal
      gimbal_threshold: 0.01