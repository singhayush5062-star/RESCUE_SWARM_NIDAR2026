world_name: "empty"
origin:
    latitude: 28.682412
    longitude: 77.499734
    altitude: 100.0
# world_bridges: set_entity_pose exposes /world/<world_name>/set_pose
# (ros_gz_interfaces/srv/SetEntityPose), used by nidar_mission_executor to
# teleport a drone to a GCS-configured launch position before arming --
# without a sim restart -- when a mission specifies drone_launch_positions.
world_bridges:
  - set_entity_pose
drones:
  # Default spawn offsets: corners of a 3.2m square (fits inside the 12ft
  # (3.6576m) launch/landing box every drone must launch from and land
  # within). The previous defaults (-2,0)/(2,0) were 4.0m apart -- already
  # outside that box before any GCS-configured launch site is ever set.
  - model_type: "px4vision"
    model_name: "drone0"
    flight_time: 60
    xyz:
      - -1.6
      - -1.6
      - 0.2
    payload:
      - model_type: "gps"
        model_name: "gps"
      - model_type: "gimbal_speed"
        model_name: "gimbal"
        # Nadir (straight down). A camera looks along its +X axis by SDF
        # convention, so a +90 deg pitch about Y aims it at the ground --
        # the standard survey-mapping mount, and the geometry the rest of
        # this project already assumes: path_planner's ground_footprint_m
        # derives the swath from a footprint directly beneath the drone,
        # and Phase 3's geotag projection intersects the camera ray with
        # the ground plane. Left at the default 0 the camera stares at the
        # horizon and sees sky, however well the lawnmower flies.
        #
        # Set on the GIMBAL, not on the hd_camera payload inside it: AS2's
        # gimbal templates apply the gimbal's own pose to the gimbaled
        # sensor and ignore the sensor's (their own FIXME, in
        # speed_gimbal.sdf.jinja line 88). An rpy on the camera entry is
        # silently discarded -- confirmed live, the rendered frame did not
        # change at all.
        rpy:
          - 0.0
          - 1.5707963
          - 0.0
        payload:
          model_type: "hd_camera"
          model_name: "camera"
  - model_type: "px4vision"
    model_name: "drone1"
    flight_time: 60
    xyz:
